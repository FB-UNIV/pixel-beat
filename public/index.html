<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelBeat</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body ondragstart="return false;" ondrop="return false;">
    <div id="sidebar">
      <div class="userControls">
        <input type="text" id="username" />
        <button id="setUsername">Set Username</button>
      </div>
      <div class="connectedUsers">
        <ul id="usersList"></ul>
      </div>
      <div class="gridControls">
        <button id="openSaveFilesList">Saved Files</button>
        <button id="sendGrid">Send Grid (Not implemented)</button>
        <button id="saveGrid">SaveGrid</button>
      </div>
    </div>
    <div id="grid" ondragstart="return false;" ondrop="return false;"></div>
    <div id="saveFilesModal" class="modal">
      <div class="modalContent">
        <form id="formContent"></form>
        <button id="loadSaveFile">Load File</button>
        <span class="closeModal">&times;</span>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
